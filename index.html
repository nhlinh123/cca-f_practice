<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCA Foundations Quiz</title>
<style>
  :root {
    --txt: #f5f3ff; --muted: rgba(233, 228, 255, .68); --line: rgba(255, 255, 255, .2);
    --c1: #22d3ee; --c2: #a78bfa; --c3: #f472b6; --ok: #34d399; --bad: #fb7185;
    --glass: linear-gradient(135deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .04));
    --blur: blur(22px) saturate(170%);
  }
  * { box-sizing: border-box; }
  body { /* no html background, so this paints the canvas and the z-index:-1 blobs stay visible */
    margin: 0; min-height: 100vh; color: var(--txt);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #120f33, #1c1446 50%, #0b1a33) fixed;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }

  /* floating aurora blobs behind the glass */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg i { position: absolute; width: 42vmax; height: 42vmax; border-radius: 50%; filter: blur(80px); opacity: .45; animation: drift 22s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { background: #7c3aed; top: -12vmax; left: -8vmax; }
  .bg i:nth-child(2) { background: #06b6d4; bottom: -14vmax; right: -10vmax; animation-delay: -7s; }
  .bg i:nth-child(3) { background: #db2777; top: 35%; left: 45%; width: 28vmax; height: 28vmax; opacity: .3; animation-delay: -14s; }

  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 72px; }

  .glass {
    position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -1px 0 rgba(255, 255, 255, .06);
  }
  .glass::before { /* glossy top sheen */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .16), transparent 38%);
  }
  .shine { overflow: hidden; }
  .shine::after { /* light sweep on hover */
    content: ""; position: absolute; top: 0; left: -70%; width: 45%; height: 100%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .28), transparent);
    transform: skewX(-20deg); transition: left .8s ease;
  }
  .shine:not(:disabled):hover::after { left: 135%; }

  /* home */
  .hero { text-align: center; padding: 28px 0 8px; animation: rise .7s both; }
  .badge { display: inline-block; padding: 6px 16px; border-radius: 99px; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .title { font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.15; margin: 18px 0 10px; font-weight: 800; letter-spacing: -.02em; }
  .title span, .grad {
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c1)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s linear infinite;
  }
  .muted { color: var(--muted); }
  .modes { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 32px; }
  .mode { text-align: left; padding: 26px; display: grid; gap: 6px; transition: transform .3s, box-shadow .3s, border-color .3s; animation: rise .7s both, bob 6s ease-in-out 1s infinite; }
  .mode:nth-child(2) { animation-delay: .12s, 2.5s; }
  .mode:hover { transform: translateY(-6px) scale(1.015); border-color: rgba(255, 255, 255, .45); box-shadow: 0 18px 50px rgba(124, 58, 237, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .mode .num { font-size: 3rem; font-weight: 800; line-height: 1; }
  .mode b { font-size: 1.2rem; }
  .keys { text-align: center; margin-top: 28px; font-size: .9rem; animation: rise .7s .25s both; }
  kbd { padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); font: inherit; font-size: .85em; }

  /* quiz */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; }
  .chip { padding: 6px 14px; border-radius: 99px; font-size: .92rem; font-weight: 600; }
  .streak { color: #fdba74; animation: pulse 1.2s ease-in-out infinite; }
  #score { display: inline-block; }
  .bump { animation: bump .5s; }
  .bar { height: 12px; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar > i {
    position: relative; display: block; height: 100%; width: 0; border-radius: inherit; transition: width .5s cubic-bezier(.3, .8, .3, 1);
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 16px rgba(167, 139, 250, .7);
  }
  .bar > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sweep 2.2s linear infinite; }
  .card { padding: 28px; overflow: hidden; }
  .card.enter { animation: rise .5s cubic-bezier(.2, .8, .2, 1); }
  .card.shake { animation: shake .45s; }
  .card.glow { animation: glow 1.1s ease-out; }
  .qtext { font-size: 1.12rem; font-weight: 600; }
  .qtext p { margin: 0 0 10px; }
  #opts { display: grid; gap: 12px; margin-top: 18px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .16);
    transition: transform .2s, background .25s, border-color .25s, box-shadow .25s;
    animation: rise .45s calc(var(--i) * 70ms + .1s) both;
  }
  button.opt:not(:disabled):hover { transform: translateX(6px); background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .4); }
  .opt:disabled { cursor: default; }
  .opt .key {
    flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem;
    background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); transition: background .25s;
  }
  .opt .txt { flex: 1; padding-top: 2px; }
  .opt.correct { background: rgba(52, 211, 153, .18); border-color: var(--ok); box-shadow: 0 0 24px rgba(52, 211, 153, .45); }
  .opt.correct .key { background: var(--ok); color: #053b2a; }
  .opt.correct .key::before { content: "✓"; } .opt.wrong .key::before { content: "✕"; }
  .opt.correct .key, .opt.wrong .key { font-size: 0; } .opt.correct .key::before, .opt.wrong .key::before { font-size: 1rem; }
  .opt.correct.picked { animation: pop .55s; }
  .opt.wrong { background: rgba(251, 113, 133, .16); border-color: var(--bad); }
  .opt.wrong .key { background: var(--bad); color: #4c0519; }
  .done .opt:not(.correct):not(.wrong) { opacity: .55; }
  .opt .tag { flex: none; align-self: center; font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: rgba(255, 255, 255, .12); }
  code { background: rgba(255, 255, 255, .13); padding: 1px 6px; border-radius: 6px; font-size: .88em; }
  #after { animation: rise .45s both; }
  #verdict { font-size: 1.25rem; font-weight: 800; margin: 22px 0 10px; }
  #verdict.ok { color: var(--ok); text-shadow: 0 0 18px rgba(52, 211, 153, .6); animation: pop .5s; }
  #verdict.bad { color: var(--bad); }
  .explain { font-size: .94rem; border-top: 1px solid var(--line); padding-top: 14px; overflow-wrap: anywhere; color: rgba(245, 243, 255, .9); }
  .explain h4 { margin: 14px 0 4px; color: var(--c1); }
  .explain ul { padding-left: 1.2em; }
  .explain a { color: var(--c1); }
  .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    position: relative; border: 1px solid rgba(255, 255, 255, .35); border-radius: 14px; padding: 12px 24px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, rgba(34, 211, 238, .85), rgba(167, 139, 250, .85) 55%, rgba(244, 114, 182, .85));
    box-shadow: 0 8px 26px rgba(124, 58, 237, .45), inset 0 1px 0 rgba(255, 255, 255, .55); transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(124, 58, 237, .6), inset 0 1px 0 rgba(255, 255, 255, .6); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn.ghost { background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }

  /* result */
  .result { text-align: center; padding: 34px 28px; animation: rise .6s both; }
  .ring { position: relative; width: 210px; height: 210px; margin: 10px auto 6px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; }
  .ring .track { stroke: rgba(255, 255, 255, .12); }
  .ring .val { stroke-linecap: round; transition: stroke-dashoffset 1.6s cubic-bezier(.3, .8, .3, 1); }
  .ring::before { /* glow via box-shadow: a CSS filter here shows as a box inside the backdrop-filtered card */
    content: ""; position: absolute; inset: 14px; border-radius: 50%; box-shadow: 0 0 36px rgba(167, 139, 250, .45), inset 0 0 30px rgba(167, 139, 250, .2);
  }
  .ring-txt { position: absolute; inset: 0; display: grid; place-content: center; }
  .ring-txt b { font-size: 3rem; line-height: 1; }
  .verdict-badge { display: inline-block; margin-top: 14px; padding: 8px 22px; border-radius: 99px; font-weight: 800; letter-spacing: .04em; }
  .verdict-badge.pass { background: rgba(52, 211, 153, .2); border: 1px solid var(--ok); color: var(--ok); box-shadow: 0 0 28px rgba(52, 211, 153, .5); animation: pop .6s 1.4s both, pulse 1.6s 2s infinite; }
  .verdict-badge.fail { background: rgba(251, 113, 133, .15); border: 1px solid var(--bad); color: var(--bad); animation: rise .6s 1.2s both; }
  .result .btn { margin-top: 26px; }

  /* review page */
  .rv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; animation: rise .5s both; }
  .rv-head h2 { margin: 0; font-size: 1.5rem; }
  #rvList { display: grid; gap: 18px; }
  .rv-card { padding: 24px; overflow: hidden; animation: rise .5s calc(min(var(--i), 8) * 70ms) both; }
  .rv-card .chip { display: inline-block; margin-bottom: 12px; background: rgba(251, 113, 133, .25); border-color: rgba(251, 113, 133, .6); }
  .rv-card .opts { display: grid; gap: 10px; margin-top: 14px; }
  .rv-card details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .rv-card summary { cursor: pointer; font-weight: 700; color: var(--c1); }
  .rv-card summary:hover { text-decoration: underline; }
  .rv-card details .explain { border-top: 0; padding-top: 4px; }

  .confetti { position: fixed; pointer-events: none; width: 9px; height: 13px; border-radius: 3px; z-index: 20; animation: fly 1s cubic-bezier(.2, .7, .3, 1) forwards; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6); }
  .fw { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.2); } }
  @keyframes flow { to { background-position: 300% 0; } }
  @keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.6); color: var(--ok); text-shadow: 0 0 12px var(--ok); } }
  @keyframes pulse { 50% { opacity: .75; transform: scale(1.04); } }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .7), 0 10px 40px rgba(0, 0, 0, .35); } 100% { box-shadow: 0 0 0 26px rgba(52, 211, 153, 0), 0 10px 40px rgba(0, 0, 0, .35); } }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
  @media (max-width: 560px) { .card, .result { padding: 20px 16px; } .mode { padding: 20px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section id="home">
    <div class="hero">
      <span class="badge glass">✦ Practice Cert</span>
      <h1 class="title">Claude Certified Architect<br><span>Foundations</span></h1>
      <p class="muted">Ngân hàng <b id="bankSize"></b> câu · đạt từ 80% · thứ tự câu &amp; đáp án được trộn ngẫu nhiên</p>
    </div>
    <div class="modes">
      <button class="mode glass shine" data-n="exam"><span class="num grad" id="examNum"></span><b>Đề thi ngẫu nhiên</b><span class="muted">Bốc ngẫu nhiên từ ngân hàng, như một lần thi thật</span></button>
      <button class="mode glass shine" data-n="all"><span class="num grad" id="allNum"></span><b>Toàn bộ câu hỏi</b><span class="muted">Ôn trọn ngân hàng câu hỏi, trộn thứ tự</span></button>
    </div>
    <p class="keys muted">Phím tắt: <kbd>A</kbd>–<kbd>D</kbd> hoặc <kbd>1</kbd>–<kbd>4</kbd> chọn · <kbd>Enter</kbd> câu tiếp</p>
  </section>

  <section id="quiz" hidden>
    <div class="top">
      <span class="chip glass" id="pos"></span>
      <span class="chips"><span class="chip glass streak" id="streak" hidden></span><span class="chip glass">✓ <span id="score">0</span></span></span>
    </div>
    <div class="bar glass"><i id="progress"></i></div>
    <article class="card glass" id="card">
      <div class="qtext" id="q"></div>
      <div id="opts"></div>
      <div id="after" hidden>
        <div id="verdict"></div>
        <div class="explain" id="explain"></div>
      </div>
    </article>
    <div class="actions">
      <button class="btn ghost shine" id="quit">Thoát</button>
      <button class="btn shine" id="next" hidden>Câu tiếp →</button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="glass result">
      <p class="muted" id="resMode"></p>
      <div class="ring">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <defs>
            <linearGradient id="gPass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
            <linearGradient id="gFail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
          </defs>
          <circle class="track" cx="80" cy="80" r="70"/>
          <circle class="val" cx="80" cy="80" r="70"/>
        </svg>
        <div class="ring-txt"><b id="resPct">0%</b><span class="muted" id="resFrac"></span></div>
      </div>
      <div class="verdict-badge" id="resBadge"></div>
      <div><button class="btn ghost shine" id="openReview"></button></div>
    </div>
    <div class="actions">
      <button class="btn ghost shine" id="home2">Về trang chủ</button>
      <button class="btn shine" id="again">Làm lại đề mới</button>
    </div>
  </section>

  <section id="review" hidden>
    <div class="rv-head">
      <button class="btn ghost shine" id="backResult">← Kết quả</button>
      <h2>Xem lại câu sai <span class="grad" id="rvCount"></span></h2>
    </div>
    <div id="rvList"></div>
    <div class="actions">
      <button class="btn ghost shine" id="backResult2">← Kết quả</button>
      <button class="btn shine" id="again2">Làm lại đề mới</button>
    </div>
  </section>
</main>

<script src="questions.js"></script>
<script>
  // Question/option/explanation HTML is allowlist-sanitized by extract.py, so innerHTML is safe here.
  const EXAM_SIZE = 63, PASS = 0.8, LETTERS = 'ABCD', RING = 2 * Math.PI * 70;
  const $ = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bank = window.QUESTIONS;
  let deck, i, score, streak, wrong, answered, mode;

  $('bankSize').textContent = $('allNum').textContent = bank.length;
  $('examNum').textContent = Math.min(EXAM_SIZE, bank.length);

  function shuffle(a) {
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [a[k], a[j]] = [a[j], a[k]];
    }
    return a;
  }

  // restart a CSS animation class
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function show(id) {
    for (const s of ['home', 'quiz', 'result', 'review']) $(s).hidden = s !== id;
    scrollTo(0, 0);
  }

  // explanations cite options by original letter as {{X}}; map to the letter shown after shuffling
  const relabel = q => q.explanation.replace(/{{([A-D])}}/g, (_, L) => LETTERS[q.order.indexOf(LETTERS.indexOf(L))]);

  function start(m) {
    mode = m;
    deck = shuffle([...bank]).slice(0, m === 'all' ? bank.length : EXAM_SIZE)
      .map(q => ({ ...q, order: shuffle(q.options.map((_, k) => k)) }));
    i = score = streak = 0;
    wrong = [];
    $('score').textContent = 0;
    $('streak').hidden = true;
    show('quiz');
    render();
  }

  function render() {
    const q = deck[i];
    answered = false;
    $('pos').textContent = `Câu ${i + 1} / ${deck.length}`;
    $('progress').style.width = `${i / deck.length * 100}%`;
    $('q').innerHTML = q.q;
    $('opts').replaceChildren(...q.order.map((k, pos) => {
      const b = document.createElement('button');
      b.className = 'opt shine';
      b.dataset.k = k;
      b.style.setProperty('--i', pos);
      b.innerHTML = `<span class="key">${LETTERS[pos]}</span><span class="txt">${q.options[k]}</span>`;
      b.onclick = () => check(b);
      return b;
    }));
    $('opts').classList.remove('done');
    $('after').hidden = $('next').hidden = true;
    $('card').classList.remove('shake', 'glow');
    replay($('card'), 'enter');
  }

  function check(b) {
    if (answered) return;
    answered = true;
    const q = deck[i], ok = +b.dataset.k === q.answer;
    b.classList.add('picked');
    $('opts').classList.add('done');
    for (const o of $('opts').children) {
      o.disabled = true;
      if (+o.dataset.k === q.answer) o.classList.add('correct');
      else if (o === b) o.classList.add('wrong');
    }
    $('card').classList.remove('enter');
    if (ok) {
      score++; streak++;
      $('score').textContent = score;
      replay($('score'), 'bump');
      replay($('card'), 'glow');
      confetti(b);
    } else {
      streak = 0;
      wrong.push({ ...q, picked: +b.dataset.k, no: i + 1 });
      replay($('card'), 'shake');
    }
    $('streak').hidden = streak < 3;
    $('streak').textContent = `🔥 ${streak} liên tiếp`;
    $('progress').style.width = `${(i + 1) / deck.length * 100}%`;
    $('verdict').textContent = ok ? ['Chính xác! 🎉', 'Tuyệt vời! ✨', 'Đúng rồi! 💯', 'Xuất sắc! 🚀'][score % 4] : 'Chưa đúng rồi 😅';
    $('verdict').className = ok ? 'ok' : 'bad';
    $('explain').innerHTML = relabel(q);
    $('after').hidden = $('next').hidden = false;
    $('next').textContent = i + 1 < deck.length ? 'Câu tiếp →' : 'Xem kết quả ✦';
    $('next').focus({ preventScroll: true });
  }

  function confetti(from) {
    if (reduced) return;
    const r = from.getBoundingClientRect(), colors = ['#22d3ee', '#a78bfa', '#f472b6', '#34d399', '#fde68a'];
    for (let n = 0; n < 40; n++) {
      const s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
      s.className = 'confetti';
      s.style.left = `${r.left + Math.random() * r.width}px`;
      s.style.top = `${r.top + r.height / 2}px`;
      s.style.background = colors[n % colors.length];
      s.style.setProperty('--dx', `${Math.cos(a) * d}px`);
      s.style.setProperty('--dy', `${Math.sin(a) * d - 70}px`);
      s.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
      s.onanimationend = () => s.remove();
      document.body.append(s);
    }
  }

  // canvas fireworks: rockets rise, burst into sparks with gravity and fading trails
  function fireworks(ms = 7000) {
    if (reduced) return;
    const c = document.createElement('canvas'), ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
    const W = innerWidth, H = innerHeight, rockets = [], sparks = [], end = performance.now() + ms;
    c.className = 'fw';
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
    document.body.append(c);
    let last = 0;
    const dot = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
    const launch = () => rockets.push({
      x: W * (.12 + Math.random() * .76), y: H, vx: (Math.random() - .5) * 2,
      vy: -Math.sqrt(2 * .15 * H * (.45 + Math.random() * .35)), hue: Math.random() * 360,
    });
    (function frame(t) {
      if ($('result').hidden) return c.remove(); // left the result screen
      if (t < end && t - last > 350) { last = t; launch(); if (Math.random() < .45) launch(); }
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (let k = rockets.length - 1; k >= 0; k--) {
        const r = rockets[k];
        r.x += r.vx; r.y += r.vy; r.vy += .15;
        dot(r.x, r.y, 2.5, `hsl(${r.hue} 100% 80%)`);
        if (r.vy >= -.5) {
          rockets.splice(k, 1);
          const n = 80 + Math.random() * 40;
          for (let s = 0; s < n; s++) {
            const a = s / n * Math.PI * 2, v = 1.5 + Math.random() * 4.5;
            sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, hue: r.hue + Math.random() * 50 - 25 });
          }
        }
      }
      for (let k = sparks.length - 1; k >= 0; k--) {
        const s = sparks[k];
        s.x += s.vx; s.y += s.vy; s.vx *= .985; s.vy = s.vy * .985 + .06; s.life -= .011;
        if (s.life <= 0) { sparks.splice(k, 1); continue; }
        dot(s.x, s.y, 2.2 * s.life + .4, `hsla(${s.hue} 100% 65% / ${s.life})`);
      }
      if (t < end || rockets.length || sparks.length) requestAnimationFrame(frame);
      else c.remove();
    })(performance.now());
  }

  function countUp(el, to) {
    if (reduced) return el.textContent = `${to}%`;
    const t0 = performance.now();
    (function f(t) {
      const p = Math.min(1, (t - t0) / 1600);
      el.textContent = `${Math.round(to * (1 - (1 - p) ** 3))}%`;
      if (p < 1) requestAnimationFrame(f);
    })(t0);
  }

  function finish() {
    const ratio = score / deck.length, passed = ratio >= PASS, rings = document.querySelectorAll('.ring .val');
    $('resMode').textContent = mode === 'all' ? 'Toàn bộ câu hỏi' : 'Đề thi ngẫu nhiên';
    $('resFrac').textContent = `${score}/${deck.length} câu đúng`;
    $('resBadge').textContent = passed ? 'ĐẠT 🎉' : 'CHƯA ĐẠT · cần 80%';
    $('resBadge').className = `verdict-badge ${passed ? 'pass' : 'fail'}`;
    for (const ring of rings) {
      ring.setAttribute('stroke', passed ? 'url(#gPass)' : 'url(#gFail)');
      ring.style.strokeDasharray = RING;
      ring.style.strokeDashoffset = RING;
    }
    $('openReview').hidden = !wrong.length;
    $('openReview').textContent = `Xem lại ${wrong.length} câu sai →`;
    buildReview();
    show('result');
    requestAnimationFrame(() => requestAnimationFrame(() => rings.forEach(r => r.style.strokeDashoffset = RING * (1 - ratio))));
    countUp($('resPct'), Math.round(ratio * 100));
    if (passed) setTimeout(fireworks, 900);
  }

  // review page: each wrong question with all options, your pick vs the correct one, and the explanation
  function buildReview() {
    $('rvCount').textContent = `(${wrong.length})`;
    $('rvList').replaceChildren(...wrong.map((q, n) => {
      const card = document.createElement('article');
      card.className = 'glass rv-card';
      card.style.setProperty('--i', n);
      const opts = q.order.map((k, pos) => {
        const cls = k === q.answer ? 'correct' : k === q.picked ? 'wrong' : '';
        const tag = k === q.answer ? '<span class="tag">Đáp án đúng</span>' : k === q.picked ? '<span class="tag">Bạn chọn</span>' : '';
        return `<div class="opt ${cls}"><span class="key">${LETTERS[pos]}</span><span class="txt">${q.options[k]}</span>${tag}</div>`;
      }).join('');
      card.innerHTML = `<span class="chip glass">Câu ${q.no}</span><div class="qtext">${q.q}</div>`
        + `<div class="opts done">${opts}</div>`
        + `<details><summary>Xem giải thích</summary><div class="explain">${relabel(q)}</div></details>`;
      return card;
    }));
  }

  function next() {
    if (++i < deck.length) render();
    else finish();
  }

  document.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.n));
  $('next').onclick = next;
  $('quit').onclick = () => confirm('Thoát bài đang làm?') && show('home');
  $('home2').onclick = () => show('home');
  $('again').onclick = $('again2').onclick = () => start(mode);
  $('openReview').onclick = () => show('review');
  $('backResult').onclick = $('backResult2').onclick = () => show('result');

  document.addEventListener('keydown', e => {
    if ($('quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = 'abcd'.indexOf(e.key.toLowerCase()) >= 0 ? 'abcd'.indexOf(e.key.toLowerCase()) : '1234'.indexOf(e.key);
    if (k >= 0 && !answered) check($('opts').children[k]);
    else if (e.key === 'Enter' && answered && document.activeElement !== $('next')) next();
  });
</script>
</body>
</html>
